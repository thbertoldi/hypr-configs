theme = "catppuccin_mocha"

[editor]
line-number = "relative"
cursorline = true
color-modes = true          # tint the mode indicator (NOR/INS/SEL)
bufferline = "multiple"     # show open buffers when >1
true-color = true
rulers = [100]              # soft guide; academic/code line length

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false              # show dotfiles in the picker (Space+f)

[editor.lsp]
display-inlay-hints = true
display-messages = true

[editor.indent-guides]
render = true

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
