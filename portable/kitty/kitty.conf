# Match portable/ghostty/config and Ghostty's Catppuccin Mocha palette.
# Hyprland supplies blur, rounded corners, shadows and peach window borders.

# Font and ligatures
font_family family="JetBrainsMono NF" style=Regular
bold_font family="JetBrainsMono NF" style=Bold
italic_font family="JetBrainsMono NF" style=Italic
bold_italic_font family="JetBrainsMono NF" style="Bold Italic"
font_size 12.0
disable_ligatures never

# Window appearance
hide_window_decorations yes
background_opacity 0.92
# Kitty uses points: 7.5 vertical / 9 horizontal = 10 / 12 px at 96 DPI.
window_padding_width 7.5 9
placement_strategy top-left

# Keep the block cursor at shell prompts as well as in terminal output.
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# Existing scrollback and clipboard behavior
scrollback_lines 3000
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait -1

# Existing key bindings
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map ctrl+shift+t launch --cwd=current --type=tab

# Basic, cursor and selection colors match Ghostty exactly.
background #1e1e2e
foreground #cdd6f4
cursor #f5e0dc
cursor_text_color #1e1e2e
selection_background #585b70
selection_foreground #cdd6f4

# All 16 ANSI colors, including Ghostty's bright variants.
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #a6adc8
color8 #585b70
color9 #f37799
color10 #89d88b
color11 #ebd391
color12 #74a8fc
color13 #f2aede
color14 #6bd7ca
color15 #bac2de

# Kitty's links, split borders and tabs use the desktop's Mocha/Peach accents.
url_color #fab387
active_border_color #fab387
inactive_border_color #313244
bell_border_color #f38ba8

# Preserve the existing tab layout; show the bar only with multiple tabs.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_align left
tab_bar_min_tabs 2
tab_bar_margin_width 0.0
tab_bar_margin_height 2.5 1.5
tab_bar_margin_color #1e1e2e
tab_bar_background #1e1e2e
active_tab_foreground #1e1e2e
active_tab_background #fab387
active_tab_font_style bold
inactive_tab_foreground #a6adc8
inactive_tab_background #313244
inactive_tab_font_style normal
tab_activity_symbol " ● "
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"
