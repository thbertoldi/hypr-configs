# Match portable/ghostty/config and Ghostty's Catppuccin Mocha palette.
# Hyprland supplies blur, rounded corners, shadows and peach window borders.

[general]
live_config_reload = true

[window]
decorations = "None"
opacity = 0.92
padding = { x = 12, y = 10 }

[font]
size = 12.0
normal = { family = "JetBrainsMono NF", style = "Regular" }
bold = { style = "Bold" }
italic = { style = "Italic" }
bold_italic = { style = "Bold Italic" }

[cursor]
style = { shape = "Block", blinking = "Off" }

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.selection]
text = "#cdd6f4"
background = "#585b70"

# Keep all 16 ANSI colors identical to Ghostty, including its bright variants.
[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[colors.bright]
black = "#585b70"
red = "#f37799"
green = "#89d88b"
yellow = "#ebd391"
blue = "#74a8fc"
magenta = "#f2aede"
cyan = "#6bd7ca"
white = "#bac2de"

# Alacritty's search, hints and vi mode use the desktop's Mocha/Peach accents.
[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#fab387"

[colors.search]
matches = { foreground = "#1e1e2e", background = "#f9e2af" }
focused_match = { foreground = "#1e1e2e", background = "#fab387" }

[colors.hints]
start = { foreground = "#1e1e2e", background = "#fab387" }
end = { foreground = "#1e1e2e", background = "#f9e2af" }

[colors.footer_bar]
foreground = "#cdd6f4"
background = "#313244"
