# Catppuccin Mocha with Peach as the primary accent.
# Keep Starship's default layout, symbols and module detection.
# Palette source and local adjustments: docs/app-themes.md.
palette = "catppuccin_mocha"

[character]
success_symbol = "[❯](bold peach)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_visual_symbol = "[❮](bold yellow)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_replace_one_symbol = "[❮](bold mauve)"

[directory]
style = "bold peach"
read_only_style = "red"

[git_branch]
style = "bold mauve"

# These modules otherwise use fixed indexed or RGB colors outside the palette.
[c]
style = "bold green"

[gleam]
style = "bold pink"

[haxe]
style = "bold peach"

[package]
style = "bold peach"

[perl]
style = "bold green"

[php]
style = "bold lavender"

[pulumi]
style = "bold mauve"

[quarto]
style = "bold blue"

[raku]
style = "bold green"

[rust]
style = "bold peach"

[swift]
style = "bold peach"

[terraform]
style = "bold mauve"

[typst]
style = "bold teal"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
