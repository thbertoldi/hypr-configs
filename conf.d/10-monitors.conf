# External 34" LG ultrawide. Match its description so DP/HDMI connector
# renames do not invalidate the profile. The current link reaches 85 Hz.
monitor = desc:LG Electronics LG ULTRAWIDE, 3440x1440@85, 0x0, 1

# The monitor listener enables the laptop panel automatically when undocked.
monitor = eDP-1, disable

# Workspaces intentionally follow whichever single monitor is currently live.
