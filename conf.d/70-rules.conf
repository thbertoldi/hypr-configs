# Float utility / dialog windows
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(org\.gnome\.Calculator)$
windowrule = float on, match:class ^(qt6ct|qt5ct|kvantummanager)$
windowrule = float on, match:class ^(file_progress)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$

# Hide Xwayland Video Bridge's capture surface (Hyprland does not honor the
# KDE-specific mechanism that normally hides this helper window).
windowrule = no_initial_focus on, no_focus on, no_anim on, no_blur on, max_size 1 1, opacity 0.0, match:class ^(xwaylandvideobridge)$
windowrule = float on, size 76% 82%, center on, match:class ^(com\.danklinux\.dankcalendar)$
windowrule = float on, size 80% 84%, center on, match:class ^spotify$
windowrule = float on, size 76% 84%, center on, match:class ^(net\.ankiweb\.Anki)$
windowrule = float on, size 76% 84%, center on, match:class ^silverbullet-app\.bin$

# Picture-in-picture
windowrule = float on, pin on, size 480 270, move (monitor_w-window_w-10) (monitor_h-window_h-10), match:title ^(Picture-in-Picture)$

# Inhibit idle while watching video / fullscreen
windowrule = idle_inhibit fullscreen, match:class .*
windowrule = idle_inhibit focus, match:class ^(mpv|com\.github\.rafostar\.Clapper)$

# Full opacity for fullscreen
windowrule = opacity 1.0 1.0, match:fullscreen true

# Layer rules
layerrule = ignore_alpha 0, match:namespace ^waybar$
layerrule = blur on, match:namespace ^notifications$
