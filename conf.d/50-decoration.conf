decoration {
    rounding = 10

    active_opacity   = 1.00
    inactive_opacity = 0.95
    fullscreen_opacity = 1.00

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(11111b80)
        offset = 0 4
    }

    blur {
        enabled = false
    }
}
