# Polkit agent (keeping mate variant from prior config; polkit-kde would also work)
exec-once = /usr/libexec/polkit-mate-authentication-agent-1

# Clipboard history daemon
exec-once = wl-paste --watch cliphist store

# Wallpaper, bar, notifications, idle daemon
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle

# Make systemd/dbus aware of the Wayland session for portals
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
