# Polkit agent (keeping mate variant from prior config; polkit-kde would also work)
exec-once = /usr/libexec/polkit-mate-authentication-agent-1

# Clipboard history daemon
exec-once = wl-paste --watch cliphist store

# Wallpaper, bar, notifications, idle daemon
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle

# NetworkManager tray applet (daemon itself runs via systemd)
exec-once = nm-applet --indicator

# KWallet daemon — kicked off early so pam_kwallet5 (set up in common-auth-pc) can
# hand it the login token and auto-unlock. The companion `ksecretd` (also shipped in
# kwalletd6) is D-Bus activated on demand and serves org.freedesktop.secrets, so any
# libsecret app (browsers, VS Code, Slack, etc.) ends up talking to this same KWallet.
exec-once = /usr/bin/kwalletd6

# Make systemd/dbus aware of the Wayland session for portals
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
