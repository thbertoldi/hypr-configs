$mod = SUPER

# === Apps ===
bind = $mod,        Return, exec, ~/.config/hypr/scripts/app-launch.sh ghostty
bind = $mod,        D,      exec, ~/.config/hypr/scripts/app-launch.sh fuzzel
bind = $mod SHIFT,  D,      exec, fuzzel --dmenu
bind = $mod,        B,      exec, ~/.config/hypr/scripts/app-launch.sh firefox
bind = $mod,        E,      exec, ~/.config/hypr/scripts/app-launch.sh ghostty -e yazi
bind = $mod,        V,      exec, sh -c 'cliphist list | fuzzel --dmenu | cliphist decode | wl-copy'
bind = $mod,        W,      exec, sh -c 'eww open --toggle dashboard'
bind = $mod,        T,      exec, ~/.config/hypr/scripts/vpn-toggle.sh
bind = $mod,        G,      exec, ~/.config/hypr/scripts/agent-menu.sh
bind = $mod,        O,      exec, ~/.config/hypr/scripts/calendar-open.sh agenda
bind = $mod,        M,      exec, ~/.config/hypr/scripts/music-open.sh
bind = $mod SHIFT,  A,      exec, ~/.config/hypr/scripts/study-open.sh all
bind = $mod CTRL,   M,      exec, ~/.config/hypr/scripts/app-launch.sh nwg-displays
bind = $mod CTRL,   B,      exec, ~/.config/hypr/scripts/app-launch.sh ghostty -e btop

# === Window ===
bind = $mod,        Q,      killactive
bind = $mod,        F,      fullscreen, 1
bind = $mod SHIFT,  F,      fullscreen, 0
bind = $mod SHIFT,  space,  togglefloating
bind = $mod,        P,      pseudo
bind = $mod SHIFT,  R,      layoutmsg, togglesplit

# === Focus (vim hjkl) ===
bind = $mod,        H, movefocus, l
bind = $mod,        J, movefocus, d
bind = $mod,        K, movefocus, u
bind = $mod,        L, movefocus, r

# === Move window ===
bind = $mod SHIFT,  H, movewindow, l
bind = $mod SHIFT,  J, movewindow, d
bind = $mod SHIFT,  K, movewindow, u
bind = $mod SHIFT,  L, movewindow, r

# === Focus monitor ===
bind = $mod CTRL,   H, focusmonitor, l
bind = $mod CTRL,   J, focusmonitor, d
bind = $mod CTRL,   K, focusmonitor, u
bind = $mod CTRL,   L, focusmonitor, r

# === Resize active ===
binde = $mod ALT,   H, resizeactive, -60 0
binde = $mod ALT,   L, resizeactive,  60 0
binde = $mod ALT,   K, resizeactive, 0 -60
binde = $mod ALT,   J, resizeactive, 0  60

# === Workspaces ===
bind = $mod,        1, workspace, 1
bind = $mod,        2, workspace, 2
bind = $mod,        3, workspace, 3
bind = $mod,        4, workspace, 4
bind = $mod,        5, workspace, 5
bind = $mod,        6, workspace, 6
bind = $mod,        7, workspace, 7
bind = $mod,        8, workspace, 8
bind = $mod,        9, workspace, 9
bind = $mod,        0, workspace, 10

bind = $mod SHIFT,  1, movetoworkspace, 1
bind = $mod SHIFT,  2, movetoworkspace, 2
bind = $mod SHIFT,  3, movetoworkspace, 3
bind = $mod SHIFT,  4, movetoworkspace, 4
bind = $mod SHIFT,  5, movetoworkspace, 5
bind = $mod SHIFT,  6, movetoworkspace, 6
bind = $mod SHIFT,  7, movetoworkspace, 7
bind = $mod SHIFT,  8, movetoworkspace, 8
bind = $mod SHIFT,  9, movetoworkspace, 9
bind = $mod SHIFT,  0, movetoworkspace, 10

bind = $mod,        Tab,   workspace, e+1
bind = $mod SHIFT,  Tab,   workspace, e-1

# Special / scratchpad
bind = $mod,        S, togglespecialworkspace
bind = $mod SHIFT,  S, movetoworkspace, special

# Mouse wheel switches workspace
bind = $mod,        mouse_down, workspace, e+1
bind = $mod,        mouse_up,   workspace, e-1

# Drag move/resize with mouse
bindm = $mod,       mouse:272, movewindow
bindm = $mod,       mouse:273, resizewindow

# === System ===
bind = $mod,        Escape,    exec, wlogout --protocol layer-shell
bind = $mod SHIFT,  Escape,    exec, hyprlock
bind = $mod SHIFT,  E,         exec, ~/.config/hypr/scripts/session-exit.sh
bind = $mod CTRL,   R,         exec, hyprctl reload
bind = $mod,        N,         exec, makoctl dismiss
bind = $mod SHIFT,  N,         exec, makoctl dismiss -a
bind = $mod CTRL,   space,     exec, makoctl restore
bind = $mod,        space,     exec, hyprctl switchxkblayout all next

# === Voice (Handy) ===
# Wayland blocks apps from grabbing global hotkeys; the compositor owns the
# bind and pokes the running Handy instance via its CLI (D-Bus single-instance).
bind = CTRL,        space,        exec, sh -c 'test -x "$HOME/Applications/Handy.AppImage" && "$HOME/Applications/Handy.AppImage" --toggle-transcription'
bind = CTRL,        Escape,       exec, sh -c 'test -x "$HOME/Applications/Handy.AppImage" && "$HOME/Applications/Handy.AppImage" --cancel'

# === smarty-pants AI rewrite (xdg-desktop-portal-hyprland GlobalShortcuts) ===
bind = $mod,        R,            global, surface-transient:rewrite
bind = $mod,        A,            global, surface-transient:academic
bind = $mod,        I,            global, surface-transient:linkedin
bind = $mod,        C,            global, surface-transient:condense

# === Screenshots (grimblast → clipboard + file) ===
bind = ,            Print,        exec, grimblast --notify copysave area   ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = SHIFT,       Print,        exec, grimblast --notify copysave screen ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = CTRL,        Print,        exec, grimblast --notify copysave active ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = $mod,        Print,        exec, ~/.config/hypr/scripts/screenshot-edit.sh
bind = $mod ALT,    R,            exec, ~/.config/hypr/scripts/screen-record-toggle.sh
bind = $mod SHIFT,  C,            exec, hyprpicker --autocopy --format=hex --notify

# === Audio (PipeWire via wpctl) ===
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/audio-control.sh up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/audio-control.sh down
bindl  = , XF86AudioMute,        exec, ~/.config/hypr/scripts/audio-control.sh toggle
bindl  = , XF86AudioMicMute,     exec, ~/.config/hypr/scripts/audio-control.sh mic-toggle

# === Brightness ===
bindel = , XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/brightness-control.sh up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness-control.sh down

# === Media keys ===
bindl = , XF86AudioPlay, exec, playerctl --player=playerctld play-pause
bindl = , XF86AudioNext, exec, playerctl --player=playerctld next
bindl = , XF86AudioPrev, exec, playerctl --player=playerctld previous

# === Lid switch ===
bindl = , switch:on:Lid Switch,  exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
