# Catppuccin Mocha lockscreen — warm accent (peach primary, maroon secondary)
$mantle = rgb(181825)
$base   = rgb(1e1e2e)
$text   = rgb(cdd6f4)
$peach  = rgb(fab387)
$maroon = rgb(eba0ac)
$surface0 = rgb(313244)

general {
    hide_cursor = true
}

background {
    monitor =
    color = $mantle
    blur_passes = 0
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $text
    font_size = 96
    font_family = JetBrainsMono NF Bold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $text
    font_size = 18
    font_family = JetBrainsMono NF
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.4
    outer_color = $maroon
    inner_color = $base
    font_color = $text
    check_color = $peach
    fail_color = rgb(f38ba8)
    placeholder_text = <span foreground="##a6adc8">password</span>
    fade_on_empty = true
    rounding = 10
    position = 0, -120
    halign = center
    valign = center
}
